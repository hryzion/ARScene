model:
  type: sar
  cond_drop_rate: 0.9  # Drop the room condition for a whole batch; 0=always conditioned, 1=unconditional.
  depth: 16
  num_heads: 8
  mlp_ratio: 4.0
  drop_rate: 0.1
  attn_drop_rate: 0.1
  drop_path_rate: 0.2
  shared_aln: true
  norm_eps: 1e-6
  attn_l2_norm: False
  use_prior_cluster: False
  word_dim: 512

  feat_extractor: resnet18
  bottleneck : residual-vae
  quant:
    vq_beta: 1
    ema_decay: 0.95

  encoder:
    type: vqvae
    token_dim: 64
    encoder_depth: 6
    num_bottleneck : 25
    decoder_depth: 4
    num_recon: 25
    num_heads: 8
    num_embeddings: 2048
    bottleneck : residual-vae
    use_codebook: true
    quant:
      vq_beta: 1
      ema_decay: 0.95
    pretrained_path: ./pretrained/vqvae/residual_vq_livingroom_wo_lat/vqvae.pth
dataset:
  filter_fn: livingroom
  dataset_dir: ./datasets/processed_livingroom
  use_objlat: false
  attr_dim: 107
  padded_length: 27

super_parameters:
  epochs: 2000
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.00001
  cuda: 0

training:
  resume: auto  # Resume last.pt in the run directory if present; or set an explicit path / null.
  seed: 42

save:
  checkpoint_every: 200  # Retain a full checkpoint every N epochs; last.pt is saved every epoch.
  save_folder: ./pretrained/interiorGPT

text_condition: true
room_mask_condition: true
