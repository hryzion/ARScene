# Network settings are unchanged. Augmentation runs on metric rows before normalization.
# conditioning: roomshape | unconditional (also --conditioning on the CLI).
# max_steps is a TOTAL update budget; null keeps 4000 full dataset passes.
# lr_step is measured in optimizer steps; null preserves the constant learning rate.
# Resume is automatic when the selected output directory contains last.pt.
dataset:
  root: ./datasets/atiss_livingroom_obb_v2_wo_lat
  filter_fn: livingroom
  use_objlat: false
  num_class: 31
  image_size: 256
  augmentations:
  - fixed_rotations
  - permutation
conditioning: roomshape
network:
  type: atiss
  n_layers: 4
  n_heads: 8
  query_dimensions: 64
  value_dimensions: 64
  feed_forward_dimensions: 1024
  hidden2output_layer: autoregressive_mlc
  hidden_dims: 512
  with_extra_fc: false
  bbox_output: autoregressive_mlc
  n_mixtures: 10
  use_room_mask_as_features: true
training:
  epochs: 4000
  max_steps: null
  splits:
  - train
  batch_size: 128
  optimizer: Adam
  lr: 0.0001
  weight_decay: 0.0
  seed: 42
  num_workers: 0
  cpu_threads: 4
  lr_step: null
  lr_decay: 0.5
  max_grad_norm: null
  log_every: 20
  save_every: 1000
  validate_every: 1000
validation:
  splits:
  - val
save:
  save_folder: ./pretrained/atiss
logger:
  project: autoregressive_transformer
