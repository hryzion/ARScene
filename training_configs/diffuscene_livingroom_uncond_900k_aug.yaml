dataset:
  root: datasets/atiss_livingroom_obb_v2_wo_lat
  dataset_dir: ./datasets/atiss_livingroom_obb_v2
  use_objlat: false
  filter_fn: livingroom
  num_class: 31
  attr_dim: 40
  padded_length: auto
  augmentations: [fixed_rotations, permutation]

normalization:
  rotation_normalization: auto

network:
  type: diffuscene
  net_type: unet1d
  room_mask_condition: false
  text_condition: false
  room_partial_condition: false
  room_arrange_condition: false
  objectness_dim: 0
  class_dim: 33
  translation_dim: 3
  size_dim: 3
  angle_dim: 2
  point_dim: 41
  objfeat_dim: 0
  learnable_embedding: true
  instance_condition: true
  instance_emb_dim: 128
  latent_dim: 64
  sample_num_points: auto
  diffusion_kwargs:
    schedule_type: linear
    beta_start: 0.0001
    beta_end: 0.02
    time_num: 1000
    loss_type: mse
    model_mean_type: v
    model_var_type: fixedsmall
    loss_separate: true
    loss_iou: false
  net_kwargs:
    dim: 512
    dim_mults: [1, 1, 1, 1]
    channels: 41
    objectness_dim: 0
    class_dim: 33
    angle_dim: 2
    objfeat_dim: 0
    context_dim: 0
    instanclass_dim: 128
    text_condition: false
    seperate_all: true

training:
  output: networks/diffuscene/runs/livingroom_uncond_900k_aug
  max_steps: 900000
  batch_size: 128
  precision: bf16
  seed: 42
  cpu_threads: 4
  lr: 0.0002
  weight_decay: 0.0
  lr_step: 120000
  lr_decay: 0.5
  max_grad_norm: 10.0
  log_every: 20
  save_every: 500
  validate_every: 1000
  initial_validation: true
