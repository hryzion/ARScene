dataset:
  root: datasets/processed_reltree_bedroom_v2
model:
  architecture: node_attribute_ar_v2
  width: 512
  layers: 8
  heads: 8
  ff_multiplier: 4
  dropout: 0.1
  cond_drop: 0.1
  max_depth: 32
  boundary_points: 32
  attribute_layers: 2
  attribute_width: 128
  attribute_heads: 4
  attribute_ff_multiplier: 2
training:
  device: cuda:0
  precision: bf16
  batch_size: 128
  allow_batch_size_change: true  # Resume from the exact consumed-sample offset.
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  epochs: 1000  # Guard above the epoch count needed to reach 100,000 total steps.
  max_steps: 100000  # Total optimizer updates, including steps restored from last.pt.
  checkpoint_every: 100
  validate_every: 1000
  log_every: 20
  initial_evaluation: false
  seed: 42
  cpu_threads: 4
  num_workers: 0
  sample_count: 4
  sample_max_depth: 12
  output: networks/reltree/runs/bedroom_ar_8x512_cd10
loss:
  type_weight: 1.0
  geometry_weights: [1, 1, 1, 1, 1, 1, 1]
  class_weight: 1.0
