dataset:
  root: datasets/processed_reltree_bedroom_v2
model:
  architecture: node_attribute_ar_v2
  width: 256
  layers: 6
  heads: 8
  ff_multiplier: 4
  dropout: 0.1
  max_depth: 32
  boundary_points: 32
  attribute_layers: 2
  attribute_width: 128
  attribute_heads: 4
  attribute_ff_multiplier: 2
training:
  device: cuda:0
  precision: bf16
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  epochs: 200
  max_steps: 2000
  validate_every: 100
  log_every: 20
  seed: 42
  cpu_threads: 4
  num_workers: 0
  sample_count: 4
  sample_max_depth: 12
  output: networks/reltree/runs/train_ar
loss:
  type_weight: 1.0
  geometry_weights: [1, 1, 1, 1, 1, 1, 1]
  class_weight: 1.0
